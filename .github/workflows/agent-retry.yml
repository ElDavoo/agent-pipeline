name: Agent · retry

# Picks up work the pipeline dropped, in two sweeps: stages that stopped before they finished,
# and stages whose turn in the queue never came.
#
# A workflow cannot wake itself up, which is why this is scheduled and not something the stalled
# stage arranges for itself. GitHub has no delay primitive, and sleeping inside the stalled job
# would hold a runner for the whole wait.
#
# Every five hours rather than hourly, because the failure this mostly exists for is a Claude
# usage limit, and those reset on a window of about that length. Retrying sooner would spend a
# stage's worth of tokens discovering the limit is still in force, and each discovery costs a
# runner and a queue slot.
#
# The first sweep re-runs the recorded run rather than dispatching a stage afresh. That is the
# only handle that works for all four: the plan stage runs against main with no branch to find it
# by, and the fix stage is a reusable workflow that cannot be dispatched at all. The run id
# travels in the marker that .github/actions/agent-stall writes into its comment.
#
# The second sweep exists because the pipeline runs one stage at a time -- see the
# `agent-pipeline` concurrency group in agent-plan.yml -- and GitHub's queue for a group holds
# exactly one pending run. A third arrival cancels the second rather than lining up behind it,
# and it does so before that run's first step, so there is no stall marker for the first sweep to
# find. This one recognises the shape such a run leaves behind instead, and is what turns the
# group from a serial drop into a serial queue.
#
# The same idea covers the other stages a displacement can drop, each by the trace it leaves:
# a pull request with no review of its head commit, and an issue labelled `agent:queued` whose
# plan never ran. They run nearest-to-merge first -- review, then implement, then plan -- and at
# most one of them starts anything per sweep: each records PIPELINE_STARTED in the job
# environment, and every later one checks it. That is an env var rather than chained step ids so
# a repository can add a queue step of its own without threading its id through all the others.

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agent-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Re-run what stalled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Three retries is fifteen hours of trying. Past that the cause is not a usage window,
          # and continuing to re-run it forever would hide a real failure behind a label that
          # looks like it is being handled.
          MAX_RETRIES: '3'
        run: |
          set -euo pipefail

          stalled=$(gh issue list --state open --label 'agent:stalled' --json number --jq '.[].number')
          if [ -z "$stalled" ]; then
            echo "nothing stalled"
            exit 0
          fi

          for issue in $stalled; do
            echo "::group::issue $issue"

            labels=$(gh issue view "$issue" --json labels --jq '[.labels[].name] | join(",")')
            case ",$labels," in
              *,agent:stop,*|*,agent:stuck,*)
                echo "stopped or already given up on — leaving alone"
                echo "::endgroup::" ; continue ;;
            esac

            # Only the bot's own comments. A marker is an instruction to this workflow, and an
            # issue comment is world-writable: on a public repository anyone can post
            # `<!-- agent-stall run=N stage=X -->`, and `last` wins. Unfiltered, that hands a
            # commenter two things. A novel stage name resets the attempt count to one, so the
            # sweep re-runs on a five-hour cadence forever -- an unbounded spend of Actions
            # minutes and Claude tokens from a comment box. And the run id is passed to
            # `gh run rerun` under a token with `actions: write`, which turns "which run" into
            # the commenter's choice among every run in the repository, including privileged
            # ones like Agent · implement that hold the push PAT.
            #
            # `github-actions[bot]` is the identity every stall comment is posted under, because
            # the stall action posts with GITHUB_TOKEN. It cannot be impersonated: `[` and `]`
            # are not legal in a GitHub username, so no human account can hold that login, and
            # user.type confirms it. gh issue view does not expose either field -- it reports the
            # login as plain `github-actions` -- so this goes through the REST API instead.
            comments=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" \
              | jq -c '[.[] | .[]
                        | select(.user.login == "github-actions[bot]" and .user.type == "Bot")
                        | .body]')
            # capture emits nothing for a comment with no marker, so this is the list of stalls
            # in order. The last one is what to re-run; the count is of that stage's stalls only,
            # because every stage writes here and a flat count of the pile measures how eventful
            # the issue was rather than whether anything is repeating. `stage` is optional in the
            # pattern so markers written before it existed still parse -- they group together as
            # the empty stage, which is the old behaviour for the old markers and nothing else.
            markers=$(jq -c '[.[] | capture("<!-- agent-stall run=(?<id>[0-9]+)(?: stage=(?<stage>[a-z-]+))? -->")]' <<<"$comments")
            run_id=$(jq -r 'last.id // empty' <<<"$markers")
            stage=$(jq -r 'last.stage // ""' <<<"$markers")
            attempts=$(jq -r --arg s "$stage" '[.[] | select((.stage // "") == $s)] | length' <<<"$markers")

            pr=$(gh pr list --head "agent/issue-${issue}" --state open --json number --jq '.[0].number // empty')

            if [ -z "$run_id" ]; then
              echo "labelled agent:stalled but no stall marker — a human labelled it, leaving alone"
              echo "::endgroup::" ; continue
            fi

            # Belt and braces on top of the authorship filter above: a marker selects among this
            # pipeline's own runs, and cannot name anything else. `gh run rerun` under
            # `actions: write` would otherwise re-run any run in the repository, and re-running a
            # privileged one is not a no-op -- Agent · implement replays with the push PAT and
            # force-pushes its branch, so a replay of an old run rewinds that branch to whatever
            # it built then. The reusable fix workflow has no runs of its own; its markers name
            # the caller, which is why only the five caller names are listed.
            wf=$(gh run view "$run_id" --json workflowName --jq .workflowName 2>/dev/null || true)
            case "$wf" in
              'Agent · plan'|'Agent · implement'|'Agent · review'|'Agent · fix CI'|'Agent · fix') ;;
              *)
                echo "::warning::marker names run $run_id, which is ${wf:-not a run in this repository} — refusing"
                gh issue edit "$issue" --add-label 'agent:stuck' --remove-label 'agent:stalled'
                gh issue comment "$issue" --body "The stall marker on this issue names run $run_id, which is not a run of this pipeline. Refusing to re-run it. Re-dispatch the stage by hand from the Actions tab."
                echo "::endgroup::" ; continue ;;
            esac

            if [ "$attempts" -gt "$MAX_RETRIES" ]; then
              echo "$attempts stalls — giving up"
              {
                printf 'The %s stage stalled %s times over about %s hours. That is no longer a usage window, ' \
                  "${stage:-unnamed}" "$attempts" "$(( attempts * 5 ))"
                printf 'so this is being handed over rather than retried again.\n\n'
                tick='`'
                printf 'Remove the %sagent:stuck%s label to let the pipeline pick it up.\n' "$tick" "$tick"
              } > /tmp/giveup.md
              gh issue comment "$issue" --body-file /tmp/giveup.md
              gh issue edit "$issue" --add-label 'agent:stuck' --remove-label 'agent:stalled'
              if [ -n "$pr" ]; then
                gh pr edit "$pr" --add-label 'agent:stuck' --remove-label 'agent:stalled'
                gh pr ready --undo "$pr" || true
              fi
              echo "::endgroup::" ; continue
            fi

            # Cleared before the re-run, not after: if the retry stalls too, the stall action
            # adds the label back and writes a fresh marker, and that is what the count above
            # reads next time.
            gh issue edit "$issue" --remove-label 'agent:stalled'
            [ -n "$pr" ] && gh pr edit "$pr" --remove-label 'agent:stalled'

            echo "re-running run $run_id — ${stage:-unnamed} stage, stall $attempts of $MAX_RETRIES"
            if ! gh run rerun "$run_id" --failed 2>&1; then
              # A run older than GitHub's re-run window, or one whose branch has gone. Nothing
              # here can recover that, and saying so is better than a label that implies a
              # retry is coming.
              gh issue edit "$issue" --add-label 'agent:stuck'
              gh issue comment "$issue" --body "Could not re-run the stalled run ($run_id) — it is likely outside GitHub's re-run window. Re-dispatch the stage by hand from the Actions tab."
            fi

            echo "::endgroup::"
          done

      # Shared by the two queue sweeps below, and checked after the stall sweep above rather than
      # before it, so a run that sweep just restarted counts as in flight.
      - name: Is the pipeline idle
        id: idle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # CUSTOMISE: every workflow in the `agent-pipeline` group, named rather than
          # pattern-matched -- add yours here if you put another stage in the group. The
          # API does not report which group a run holds, and `Agent · fix` never appears here at
          # all because a reusable workflow has no runs of its own -- its caller's name is what
          # shows. Getting this list wrong is not dangerous, only wasteful: a missed name starts
          # a run that then queues behind the one already going.
          #
          # 200 rather than a page, because this reads the recent list and filters it client-side
          # rather than asking for a status the API can filter on -- gh takes one --status at a
          # time and there are three that are not "completed", counting the `waiting` a run sits
          # in while an approval gate holds it. An implement stage now has a two-hour timeout,
          # and Android CI can easily push it past the first sixty entries in that time.
          # shellcheck disable=SC2016  # $w is a jq variable and has to reach jq unexpanded;
          # double quotes here would substitute it away before jq ever saw it.
          busy=$(gh run list --limit 200 --json workflowName,status --jq '
            [ .[] | select(.status != "completed")
                  | select(.workflowName as $w
                           | ["Agent · plan","Agent · implement","Agent · review",
                              "Agent · fix CI"]
                           | index($w)) ] | length')
          if [ "$busy" -gt 0 ]; then
            echo "$busy pipeline run(s) still in flight — the queue is not idle, leaving it"
            echo "idle=false" >> "$GITHUB_OUTPUT"
          else
            echo "idle=true" >> "$GITHUB_OUTPUT"
          fi

      # A review displaced out of the group. agent-review.yml declares the group at workflow level
      # (it calls the reusable fix stage, see README.md), so a cancelled review leaves no job and no
      # marker -- only an open agent pull request with no review by the bot on its head commit.
      # Nothing else produces that shape while the group is idle: every push that moves the head
      # triggers a review, and a stalled one carries `agent:stalled`, which is the first sweep's.
      #
      # Restarted by closing and reopening the pull request, the handle README.md documents. It is
      # the only one that works: the stage has no dispatch trigger, and re-running the cancelled
      # run would replay the workflow file as it was. Closing disarms auto-merge, so it is
      # re-armed straight after -- safe, since nothing merges before the review this starts has
      # approved.
      #
      # Bounded per head commit rather than per pull request: a long fix loop can legitimately
      # need more than three restarts across its commits, but three on the same commit is a
      # review that fails before recording anything, every time.
      - name: Review the next pull request whose review never came
        if: steps.idle.outputs.idle == 'true' && env.PIPELINE_STARTED != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # The PAT: a close and reopen by GITHUB_TOKEN triggers no workflow, so the review would
          # never start. The same trap as the dispatches below.
          DISPATCH_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN }}
          MAX_RETRIES: '3'
        run: |
          set -euo pipefail

          prs=$(gh pr list --state open --limit 100 --json number,headRefName,headRefOid,isDraft,labels --jq '
                  [ .[] | select(.headRefName | startswith("agent/issue-"))
                        | select(.isDraft | not)
                        | select([.labels[].name] | any(IN("agent:stop","agent:stuck","agent:stalled")) | not) ]
                  | sort_by(.number) | .[] | "\(.number) \(.headRefOid)"')
          if [ -z "$prs" ]; then
            echo "no agent pull request waiting"
            exit 0
          fi

          while read -r pr sha <&3; do
            # Bot-authored only, for the same reason as the markers above: anyone can review a
            # public pull request, and a stranger's review must not make this one look done.
            reviewed=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${pr}/reviews" \
              | jq --arg sha "$sha" '[.[] | .[] | select(.user.login == "github-actions[bot]"
                                                         and .user.type == "Bot"
                                                         and .commit_id == $sha)] | length')
            if [ "$reviewed" -gt 0 ]; then
              continue
            fi

            started=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" \
              | jq --arg m "<!-- agent-review-queued sha=${sha} -->" \
                   '[.[] | .[] | select(.user.login == "github-actions[bot]" and .user.type == "Bot")
                              | .body | select(contains($m))] | length')
            if [ "$started" -ge "$MAX_RETRIES" ]; then
              echo "PR #$pr: review restarted $started times on ${sha:0:7} — giving up"
              gh pr comment "$pr" --body "The review of this pull request has been restarted $started times on the same commit and has never recorded a verdict, so it is being handed over rather than restarted again. Remove the \`agent:stuck\` label and mark it ready for review to let the pipeline pick it up."
              gh pr edit "$pr" --add-label 'agent:stuck'
              gh pr ready --undo "$pr" || true
              continue
            fi

            echo "pipeline idle — restarting the review of PR #$pr at ${sha:0:7}"
            gh pr comment "$pr" --body "Restarting the review — the pipeline runs one agent at a time and this pull request's review never got its turn. <!-- agent-review-queued sha=${sha} -->"
            GH_TOKEN="$DISPATCH_TOKEN" gh pr close "$pr"
            GH_TOKEN="$DISPATCH_TOKEN" gh pr reopen "$pr"
            GH_TOKEN="$DISPATCH_TOKEN" gh pr merge --auto --squash "$pr" \
              || echo "::warning::could not re-arm auto-merge on PR #$pr"
            echo "PIPELINE_STARTED=true" >> "$GITHUB_ENV"
            exit 0
          done 3<<<"$prs"

          echo "every agent pull request has a review of its head commit"

      # The queue draining. An issue displaced out of the concurrency group leaves no marker, so
      # this looks for its signature instead: the implement stage swaps `agent:planned` for
      # `agent:working` only once its pull request exists, so an open issue still labelled
      # `agent:planned` with no branch of its own is one whose turn never came.
      #
      # Re-dispatching is safe by construction rather than by luck. The stage resets its branch
      # from main before it writes anything, and it re-reads the plan from the issue body rather
      # than from the dispatch inputs -- which is why the two optional inputs are left off here
      # and the stage falls back to the issue title. So a redundant dispatch costs a run and
      # rebuilds the same branch; it cannot land the wrong plan or half of one.
      #
      # One issue per sweep, and only when nothing else is running. Starting two would undo the
      # thing this exists to serve, and the same five-hour cadence that suits a usage window
      # suits a queue whose items take the better part of an hour.
      - name: Start the next issue whose turn never came
        if: steps.idle.outputs.idle == 'true' && env.PIPELINE_STARTED != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # The PAT, not GITHUB_TOKEN: a workflow dispatched with GITHUB_TOKEN does not run at
          # all. Same trap as agent-plan.yml's hand-over step, and the reason this sweep would
          # otherwise look like it worked while nothing started.
          DISPATCH_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN }}
          # Three starts from the queue, the same budget the stall loop gets and for the same
          # reason. Declared again here rather than hoisted to the job: the two counts are
          # independent, and one of them moving because the other was retuned is not wanted.
          MAX_RETRIES: '3'
        run: |
          set -euo pipefail

          # Oldest first, so a displaced issue is not overtaken by every issue filed after it.
          # The label filters are the same kill switches every other stage honours, plus
          # agent:stalled, which belongs to the sweep above rather than to this one.
          waiting=$(gh issue list --state open --label 'agent:planned' --limit 100 \
                      --json number,labels --jq '
                      [ .[] | select([.labels[].name]
                                     | any(IN("agent:stop","no-agent","agent:stuck",
                                              "agent:stalled","agent:working"))
                                     | not)
                            | .number ] | sort | first // empty')
          if [ -z "$waiting" ]; then
            echo "nothing waiting"
            exit 0
          fi

          # Belt and braces on the label. A pull request already open for the branch means the
          # stage did reach the end and the label is simply stale, which is not this sweep's to
          # fix and definitely not its to force-push over.
          pr=$(gh pr list --head "agent/issue-${waiting}" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            echo "issue $waiting already has PR #$pr — stale label, leaving alone"
            exit 0
          fi

          # Bounded, for the same reason the stall loop above is. `agent:planned` with no pull
          # request is not only what a displaced run leaves behind -- it is also what a run that
          # got all the way to "nothing was changed, no pull request to open" leaves behind, and
          # that one will leave it again on every sweep. Unbounded, this would restart such an
          # issue every five hours forever, which is the failure the stall loop's MAX_RETRIES
          # exists to stop and would be worse here: a stall costs a stopped run, this costs a
          # whole one. Same authorship filter as above, and for the same reason -- the marker is
          # an instruction to this workflow and an issue comment is world-writable.
          started=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${waiting}/comments" \
                      --jq '[.[] | select(.user.login == "github-actions[bot]" and .user.type == "Bot")
                                 | .body | select(test("<!-- agent-queued -->"))] | length')
          if [ "$started" -ge "$MAX_RETRIES" ]; then
            echo "started $started times from the queue already — giving up"
            gh issue comment "$waiting" --body "This issue has been started $started times from the queue and has never reached a pull request, so it is being handed over rather than started again. Remove the \`agent:stuck\` label to let the pipeline pick it up."
            gh issue edit "$waiting" --add-label 'agent:stuck'
            exit 0
          fi

          author=$(gh issue view "$waiting" --json author --jq .author.login)
          echo "pipeline idle — starting issue $waiting (filed by $author)"

          # The marker goes down before the dispatch, not after. A dispatch that succeeds and a
          # run that then fails to record anything is the case this is counting; recording it
          # afterwards would miss exactly that, and a `gh workflow run` that fails is visible in
          # this job's own log anyway.
          gh issue comment "$waiting" --body "Starting this now — the pipeline runs one agent at a time and this one's turn had not come. <!-- agent-queued -->"
          GH_TOKEN="$DISPATCH_TOKEN" gh workflow run agent-implement.yml \
            -f issue="$waiting" -f author="$author"
          echo "PIPELINE_STARTED=true" >> "$GITHUB_ENV"

      # The same drain for the plan stage. Its signature is `agent:queued` -- put there by
      # agent-plan.yml's triage, for an issue it cleared to run -- with none of the labels a plan
      # that got further would have added. An issue filed before that label existed carries no
      # trace and is never picked up here; dispatch agent-plan.yml for it by hand.
      #
      # Dispatching is safe for the same reason it is for the implement stage: agent-plan.yml's
      # triage re-reads the issue and refuses one that is closed or already past planning, so a
      # dispatch that races a plan finishing is a skipped run rather than a plan of the plan.
      - name: Plan the next issue whose turn never came
        if: steps.idle.outputs.idle == 'true' && env.PIPELINE_STARTED != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # The PAT, for the same reason as the step above.
          DISPATCH_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN }}
          MAX_RETRIES: '3'
          # CUSTOMISE: keep equal to MAX_OPEN_AGENT_PRS in agent-plan.yml. Checked here too so a
          # sweep does not spend one of an issue's three starts on a plan run that would only
          # decline at the cap.
          MAX_OPEN_AGENT_PRS: '3'
        run: |
          set -euo pipefail

          open=$(gh pr list --state open --json headRefName \
                   --jq '[.[] | select(.headRefName | startswith("agent/"))] | length')
          if [ "$open" -ge "$MAX_OPEN_AGENT_PRS" ]; then
            echo "$open agent pull requests open, at the cap — not planning anything new"
            exit 0
          fi

          waiting=$(gh issue list --state open --label 'agent:queued' --limit 100 \
                      --json number,labels --jq '
                      [ .[] | select([.labels[].name]
                                     | any(IN("agent:stop","no-agent","agent:stuck","agent:stalled",
                                              "agent:planned","agent:working"))
                                     | not)
                            | .number ] | sort | first // empty')
          if [ -z "$waiting" ]; then
            echo "no plan waiting"
            exit 0
          fi

          # Bounded like the step above, with its own marker so the two counts stay independent.
          # A plan run that keeps ending without `agent:planned` -- declining at a cap this step
          # disagrees with, or failing before the stall step -- would otherwise be restarted
          # every five hours forever.
          started=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${waiting}/comments" \
                      --jq '[.[] | select(.user.login == "github-actions[bot]" and .user.type == "Bot")
                                 | .body | select(test("<!-- agent-plan-queued -->"))] | length')
          if [ "$started" -ge "$MAX_RETRIES" ]; then
            echo "planning started $started times from the queue already — giving up"
            gh issue comment "$waiting" --body "Planning this issue has been started $started times from the queue and it has never come out planned, so it is being handed over rather than started again. Remove the \`agent:stuck\` label to let the pipeline pick it up."
            gh issue edit "$waiting" --add-label 'agent:stuck'
            exit 0
          fi

          echo "pipeline idle — planning issue $waiting"
          gh issue comment "$waiting" --body "Planning this now — the pipeline runs one agent at a time and this one's plan never got its turn. <!-- agent-plan-queued -->"
          GH_TOKEN="$DISPATCH_TOKEN" gh workflow run agent-plan.yml -f issue="$waiting"
          echo "PIPELINE_STARTED=true" >> "$GITHUB_ENV"
